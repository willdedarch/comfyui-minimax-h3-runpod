name: Build and publish ComfyUI H3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build combined image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/willdedarch/comfyui-minimax-h3-runpod:both-1.1.0
          build-args: H3_PROFILE=both
          labels: |
            org.opencontainers.image.source=https://github.com/willdedarch/comfyui-minimax-h3-runpod
            org.opencontainers.image.description=Official Runpod ComfyUI with MiniMax H3 I2V and Reference-to-Video
      - name: Validate both workflows before publishing
        run: |
          for profile in i2v r2v both; do
            docker run --rm -e H3_PROFILE="$profile" --entrypoint python3.12 ghcr.io/willdedarch/comfyui-minimax-h3-runpod:both-1.1.0 /opt/validate-image.py
          done
      - name: Publish validated image
        run: docker push ghcr.io/willdedarch/comfyui-minimax-h3-runpod:both-1.1.0
